<section class="mood-diary-page" id="moodPage" aria-labelledby="moodDiaryHeading" hidden>
  <h2 class="mood-visually-hidden" id="moodDiaryHeading" data-page-heading="mood" tabindex="-1">心情日记</h2>

  <div class="mood-diary-login-state" id="moodLoginState" hidden>
    <h3>登录后记录心情</h3>
    <p>登录后，你可以记录、编辑和回看自己的心情。</p>
  </div>

  <div class="mood-diary-family-state" id="moodFamilyState" hidden>
    <h3>先建立一个家庭组</h3>
    <p>你可以先独自使用心情日记，也可以去家庭设置邀请另一位成员。</p>
    <button class="mood-secondary-button" id="moodOpenFamilySettings" type="button" data-mood-open-family-settings>
      前往家庭设置
    </button>
  </div>

  <section class="mood-calendar-section" id="moodCalendarView" aria-labelledby="moodMonthLabel">
    <div class="mood-month-toolbar">
      <button class="mood-icon-button" id="moodMonthPrevious" type="button" aria-label="上个月">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14.5 5-7 7 7 7" /></svg>
      </button>
      <div class="mood-month-heading">
        <h3 id="moodMonthLabel">—</h3>
        <p id="moodMonthSubLabel">当前月份</p>
      </div>
      <button class="mood-icon-button" id="moodMonthNext" type="button" aria-label="下个月">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 5 7 7-7 7" /></svg>
      </button>
    </div>
    <div class="mood-diary-status" id="moodDiaryStatus" role="status" aria-live="polite"></div>
    <button class="mood-secondary-button mood-status-retry" id="moodMonthRetry" type="button" hidden>重试本月</button>
    <div class="mood-calendar-weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="mood-calendar-grid" id="moodCalendarGrid"></div>
    <div class="mood-calendar-legend" id="moodCalendarLegend" aria-label="座位说明"></div>
  </section>

  <div class="mood-month-dashboard" id="moodMonthSummary" aria-label="本月心情汇总">
    <section class="mood-summary-section mood-jar-section" aria-labelledby="moodJarHeading">
      <div class="mood-summary-heading">
        <div>
          <h3 id="moodJarHeading">本月心情罐</h3>
          <p id="moodJarCount">0 条记录</p>
        </div>
        <span class="mood-summary-sync" id="moodJarSync" hidden>正在同步</span>
      </div>
      <div class="mood-jar-stage" id="moodJarStage">
        <svg class="mood-jar-outline mood-jar-back" viewBox="0 0 320 360" width="320" height="360" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <path class="mood-jar-glass" d="M108 48H212V66C212 78 218 86 232 98C248 113 256 136 256 164V250C256 292 222 324 180 324H140C98 324 64 292 64 250V164C64 136 72 113 88 98C102 86 108 78 108 66V48Z" />
          <path class="mood-jar-rim-back" d="M104 30H216V50H104Z" />
        </svg>
        <div class="mood-jar-viewport" id="moodJarViewport">
          <div class="mood-jar-items" id="moodJarItems" aria-hidden="true"></div>
        </div>
        <svg class="mood-jar-outline mood-jar-front" viewBox="0 0 320 360" width="320" height="360" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false">
          <path class="mood-jar-body" d="M108 48H212V66C212 78 218 86 232 98C248 113 256 136 256 164V250C256 292 222 324 180 324H140C98 324 64 292 64 250V164C64 136 72 113 88 98C102 86 108 78 108 66V48Z" />
          <path class="mood-jar-rim" d="M104 40C104 34.5 129 30 160 30C191 30 216 34.5 216 40V48C216 53.5 191 58 160 58C129 58 104 53.5 104 48V40Z" />
          <path class="mood-jar-highlight" d="M94 126C85 145 80 162 80 184V246C80 277 100 300 128 309" />
          <path class="mood-jar-base" d="M68 302C91 318 112 324 140 324H180C208 324 229 318 252 302" />
        </svg>
      </div>
      <p class="mood-jar-caption" id="moodJarSummary">这个月还没有心情记录。</p>
    </section>

    <section class="mood-summary-section mood-dominant-section" aria-labelledby="moodDominantHeading">
      <div class="mood-summary-heading">
        <div>
          <h3 id="moodDominantHeading">本月最多心情</h3>
          <p>按记录次数回看每位成员的主旋律</p>
        </div>
      </div>
      <div class="mood-dominant-list" id="moodDominantList"></div>
    </section>

    <section class="mood-summary-section mood-trend-section" aria-labelledby="moodTrendHeading">
      <div class="mood-summary-heading">
        <div>
          <h3 id="moodTrendHeading">心情趋势</h3>
          <p>高涨、平稳、低落三档仅用于回顾本月起伏</p>
        </div>
      </div>
      <p class="mood-trend-disclaimer" id="moodTrendDisclaimer">趋势用于回顾本月心情起伏，不代表健康评估；虚线表示两次真实记录之间没有记录的日期。</p>
      <div class="mood-trend-legend" id="moodTrendLegend" aria-label="趋势图例"></div>
      <div class="mood-trend-chart-shell" id="moodTrendChartShell">
        <svg class="mood-trend-chart" id="moodTrendChart" viewBox="0 0 720 260" width="720" height="260" preserveAspectRatio="xMidYMid meet" role="group" aria-labelledby="moodTrendHeading moodTrendSummary" hidden></svg>
        <div class="mood-trend-point-controls" id="moodTrendPointControls"></div>
        <p class="mood-empty-state" id="moodTrendEmpty" hidden>这个月还没有趋势数据，记录一条心情后就会显示。</p>
        <div class="mood-trend-tooltip" id="moodTrendTooltip" role="tooltip" hidden></div>
      </div>
      <p class="mood-trend-summary" id="moodTrendSummary"></p>
      <details class="mood-trend-details" id="moodTrendDetails">
        <summary>查看按日明细</summary>
        <div class="mood-trend-details-content" id="moodTrendDetailsContent"></div>
      </details>
    </section>

    <div class="mood-month-footer-action">
      <button class="mood-secondary-button mood-all-diary-button" id="moodListOpen" type="button">全部日记</button>
    </div>
  </div>

  <section class="mood-history-section" id="moodListView" aria-labelledby="moodListHeading" hidden>
    <div class="mood-section-heading">
      <div>
        <h3 id="moodListHeading">全部心情日记</h3>
      </div>
      <button class="mood-secondary-button" id="moodCalendarOpen" type="button">回到日历</button>
    </div>
    <div class="mood-history-list" id="moodHistoryList"></div>
    <p class="mood-empty-state" id="moodHistoryEmpty" hidden>还没有心情日记，今天就写下第一条吧。</p>
    <button class="mood-load-more" id="moodHistoryLoadMore" type="button" hidden>加载更早的日记</button>
  </section>

  <button class="mood-fab" id="moodFab" type="button" aria-label="记录今天的心情">
    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 16.5-.8 3.8 3.8-.8L18.8 7.7a2.4 2.4 0 0 0-3.4-3.4L4 16.5Z" /><path d="m13.8 5.2 5 5" /></svg>
  </button>

</section>
