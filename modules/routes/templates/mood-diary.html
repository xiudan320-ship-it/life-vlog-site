<section class="mood-diary-page" id="moodPage" aria-labelledby="moodDiaryHeading" hidden>
  <header class="mood-diary-header">
    <div>
      <p class="kicker">Mood Diary</p>
      <h2 id="moodDiaryHeading" data-page-heading="mood" tabindex="-1">心情日记</h2>
      <p class="mood-diary-lede" id="moodDiaryLede">把今天的心情，留给未来的自己。</p>
    </div>
    <div class="mood-diary-header-actions" aria-label="心情日记视图">
      <button class="mood-secondary-button" id="moodListOpen" type="button">全部日记</button>
    </div>
  </header>

  <div class="mood-diary-login-state" id="moodLoginState" hidden>
    <h3>登录后记录心情</h3>
    <p>登录后，你可以记录、编辑和回看自己的心情。</p>
  </div>

  <div class="mood-diary-family-state" id="moodFamilyState" hidden>
    <h3>先建立一个家庭组</h3>
    <p>你可以先独自使用心情日记，也可以去家庭设置邀请另一位成员。</p>
    <button class="mood-secondary-button" id="moodOpenFamilySettings" type="button" data-mood-open-family-settings>
      前往家庭设置
    </button>
  </div>

  <div class="mood-diary-status" id="moodDiaryStatus" role="status" aria-live="polite"></div>

  <section class="mood-calendar-section" id="moodCalendarView" aria-labelledby="moodMonthLabel">
    <div class="mood-month-toolbar">
      <button class="mood-icon-button" id="moodMonthPrevious" type="button" aria-label="上个月">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m14.5 5-7 7 7 7" /></svg>
      </button>
      <div class="mood-month-heading">
        <h3 id="moodMonthLabel">—</h3>
        <p id="moodMonthSubLabel">当前月份</p>
      </div>
      <button class="mood-icon-button" id="moodMonthNext" type="button" aria-label="下个月">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m9.5 5 7 7-7 7" /></svg>
      </button>
    </div>
    <div class="mood-calendar-weekdays" aria-hidden="true">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="mood-calendar-grid" id="moodCalendarGrid"></div>
    <div class="mood-calendar-legend" id="moodCalendarLegend" aria-label="座位说明"></div>
  </section>

  <section class="mood-history-section" id="moodListView" aria-labelledby="moodListHeading" hidden>
    <div class="mood-section-heading">
      <div>
        <p class="kicker">Your archive</p>
        <h3 id="moodListHeading">全部心情日记</h3>
      </div>
      <button class="mood-secondary-button" id="moodCalendarOpen" type="button">回到日历</button>
    </div>
    <div class="mood-history-list" id="moodHistoryList"></div>
    <p class="mood-empty-state" id="moodHistoryEmpty" hidden>还没有心情日记，今天就写下第一条吧。</p>
    <button class="mood-load-more" id="moodHistoryLoadMore" type="button" hidden>加载更早的日记</button>
  </section>

  <button class="mood-fab" id="moodFab" type="button" aria-label="记录今天的心情">
    <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 16.5-.8 3.8 3.8-.8L18.8 7.7a2.4 2.4 0 0 0-3.4-3.4L4 16.5Z" /><path d="m13.8 5.2 5 5" /></svg>
  </button>

</section>
