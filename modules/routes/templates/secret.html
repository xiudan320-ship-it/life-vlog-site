      <section class="secret-page" id="secretPage" hidden>
        <div class="secret-head">
          <div>
            <p class="kicker">Secret Gallery</p>
            <h2 data-page-heading="secret">秘藏图集</h2>
            <p>私人画廊，可以创建相册、上传收藏图，并按照片 tag 展览。</p>
          </div>
          <p class="status-line" id="secretStatus"></p>
        </div>

        <section class="secret-composer" id="secretComposer" hidden>
          <div class="section-title">
            <button class="section-heading-button" id="secretToggle" type="button" aria-expanded="false">
              <p class="kicker">Album</p>
              <h2>新建相册 / 上传图片</h2>
            </button>
          </div>

          <form class="secret-form" id="secretForm" hidden>
            <label class="secret-image-drop" id="secretImageDrop" tabindex="0">
              <input class="native-file-input" id="secretImageInput" type="file" accept="image/*" multiple />
              <img id="secretImagePreview" alt="秘藏图片预览" hidden />
              <div class="preview-strip" id="secretPreviewStrip" hidden></div>
              <span class="upload-native-trigger">选择图片</span>
              <strong id="secretImageName">还没有选择图片</strong>
            </label>
            <div class="image-link-adder">
              <input id="secretImageLinkInput" type="url" inputmode="url" placeholder="粘贴图片链接" aria-label="秘藏图片链接" />
              <button id="secretImageLinkAdd" type="button">添加</button>
            </div>
            <label>
              自定义封面
              <input class="native-file-input" id="secretCoverInput" type="file" accept="image/*" />
            </label>
            <div class="form-grid">
              <label>
                相册名
                <input id="secretTitleInput" maxlength="80" placeholder="比如：灵感收藏" />
              </label>
              <input id="secretCategoryInput" type="hidden" value="未分类" />
              <datalist id="secretCategoryList"></datalist>
              <label>
                所属文件夹
                <select id="secretFolderInput">
                  <option value="">未归档</option>
                </select>
              </label>
              <label>
                关联日记
                <select id="secretLinkedPhotoInput">
                  <option value="">不关联</option>
                </select>
              </label>
            </div>
            <label>
              备注
              <textarea id="secretNoteInput" rows="4"></textarea>
            </label>
            <div class="secret-form-actions">
              <button class="primary" id="secretSubmitButton" type="submit">保存相册</button>
            </div>
          </form>
        </section>

        <div class="secret-library-layout">
          <aside class="secret-library-sidebar" aria-label="秘藏收藏夹">
            <label class="secret-search" for="secretSearchInput">
              <span>搜索展品</span>
              <input id="secretSearchInput" type="search" list="secretSearchSuggestions" placeholder="相册或 Tag" autocomplete="off" />
              <datalist id="secretSearchSuggestions"></datalist>
            </label>
            <div class="secret-sidebar-heading">
              <span>收藏夹</span>
              <button class="secret-create-folder-button" type="button" id="secretCreateFolderButton" aria-label="新建文件夹" title="新建文件夹">
                <span class="secret-create-folder-icon" aria-hidden="true">+</span>
                <span class="secret-create-folder-label">新建文件夹</span>
              </button>
            </div>
            <nav class="secret-folder-list" id="secretFolderList" aria-label="秘藏文件夹"></nav>
          </aside>
          <div class="secret-library-main">
            <div class="secret-filters" id="secretFilters" role="group" aria-label="秘藏照片标签筛选"></div>
            <section class="secret-gallery" id="secretGallery" aria-live="polite"></section>
          </div>
        </div>
      </section>
    </main>
