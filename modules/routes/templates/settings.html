      <dialog class="settings-dialog" id="settingsDialog" aria-labelledby="settingsDialogTitle">
        <div class="settings-shell" data-settings-shell>
          <header class="settings-header">
            <div class="settings-header-copy">
              <h2 id="settingsDialogTitle">设置</h2>
              <p>管理咻蛋之家在这台设备上的显示、账户和数据。</p>
            </div>
            <button class="dialog-close" id="closeSettingsDialog" type="button" aria-label="关闭设置"><svg class="list-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
          </header>
          <div class="settings-search" data-settings-search>
            <label for="settingsSearchInput">搜索设置</label>
            <div class="settings-search-field">
              <svg class="settings-search-icon" aria-hidden="true"><use href="#i-search"></use></svg>
              <input id="settingsSearchInput" type="search" autocomplete="off" spellcheck="false" placeholder="搜索密码、通知、缓存…" />
              <button type="button" id="settingsSearchClear" aria-label="清除设置搜索" hidden>清除</button>
            </div>
            <p class="settings-search-status" data-settings-search-status aria-live="polite"></p>
            <div class="settings-search-results" data-settings-search-results hidden></div>
          </div>
          <div class="settings-mobile-header" data-settings-mobile-header hidden>
            <button type="button" data-settings-back aria-label="返回设置分类"><svg class="list-icon" aria-hidden="true"><use href="#i-chevron-left"></use></svg><span>设置分类</span></button>
            <h3 data-settings-mobile-title>外观与使用</h3>
          </div>
          <div class="settings-layout">
            <aside class="settings-sidebar" data-settings-directory>
              <div class="settings-directory-heading"><span>设置分类</span><small>选择一个分类开始</small></div>
              <nav data-settings-nav aria-label="设置分类"></nav>
            </aside>
            <main class="settings-content" data-settings-content tabindex="-1"></main>
          </div>
        </div>
      </dialog>
      <dialog class="account-dialog" id="familyTaglineDialog">
        <button class="dialog-close" type="button" data-close-family-tagline aria-label="关闭"><svg class="list-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18" /></svg></button>
        <form id="familyTaglineForm">
          <div><p class="kicker">Family Signature</p><h2>家庭签名</h2><p>会显示在封面上，并同步给当前家庭的所有成员。</p></div>
          <label>签名<textarea id="familyTaglineInput" rows="3" maxlength="120" required></textarea></label>
          <p class="status-line" id="familyTaglineStatus"></p>
          <div class="rename-home-actions"><button class="ghost-button" type="button" data-reset-family-tagline>恢复默认</button><button class="primary" type="submit">保存签名</button></div>
        </form>
      </dialog>
