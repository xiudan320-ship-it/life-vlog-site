      { id: "loc-entry", user_id: "owner", name: "玄关抽屉", note: "配饰和常穿的小包", sort_order: 1, created_at: now, updated_at: now },
      { id: "loc-storage", user_id: "owner", name: "储物间衣架", note: "换季外套", sort_order: 2, created_at: now, updated_at: now },
    ];
    let items = [
      { id: "a", user_id: "owner", wearer_user_id: "owner", name: "森林绿针织开衫", item_type: "item", category: "上装", description: "柔软，适合搭浅色裙子。", fit_note: "袖口刚好，里面还能加薄打底。", location_id: "loc-bedroom", status: "available", seasons: ["春", "秋"], occasions: ["通勤", "约会"], style_tags: ["复古", "温柔"], color_tags: ["森林绿"], images: [images.wide, images.portrait, images.square], is_favorite: true, wear_count: 8, last_worn_at: "2026-08-02T08:00:00Z", created_at: now, updated_at: now },
      { id: "b", user_id: "member", wearer_user_id: "member", name: "奶油白连衣裙", item_type: "item", category: "连衣裙", description: "侧面和背后都有系带。", fit_note: "腰围合适，坐下不会紧。", location_id: "loc-bedroom", status: "available", seasons: ["夏"], occasions: ["约会", "旅行"], style_tags: ["法式"], color_tags: ["奶油白"], images: [images.portrait, images.logo, images.food], is_favorite: false, wear_count: 3, last_worn_at: "2026-07-18T08:00:00Z", created_at: now, updated_at: now },
      { id: "c", user_id: "owner", wearer_user_id: "owner", name: "周末散步整套", item_type: "outfit", category: "整套", description: "开衫、白裙和棕色小包的一整套。", fit_note: "适合 18 至 24 度。", location_id: "loc-bedroom", status: "available", seasons: ["春", "秋"], occasions: ["约会", "旅行"], style_tags: ["整套", "散步"], color_tags: ["绿", "白", "棕"], images: [images.square, images.wide], is_favorite: true, wear_count: 2, last_worn_at: "2026-06-12T08:00:00Z", created_at: now, updated_at: now },
      { id: "d", user_id: "owner", wearer_user_id: "owner", name: "棕色乐福鞋", item_type: "item", category: "鞋", description: "走路久也不磨脚。", fit_note: "厚袜会稍紧。", location_id: "loc-entry", status: "available", seasons: ["春", "秋", "冬"], occasions: ["通勤", "旅行"], style_tags: ["百搭"], color_tags: ["棕色"], images: [images.food], is_favorite: false, wear_count: 14, last_worn_at: "2026-08-08T08:00:00Z", created_at: now, updated_at: now },

    ];

    const ok = (data) => Promise.resolve({ data, error: null });
    const repository = {
      listItems: () => ok(items), listLocations: () => ok(locations), listWearLogs: () => ok([]),
      insertItem: (record) => { items = [{ ...record, user_id: "owner" }, ...items]; return ok(items[0]); },
      updateItem: (id, patch) => { items = items.map((item) => item.id === id ? { ...item, ...patch } : item); return ok(items.find((item) => item.id === id)); },
      removeItem: (id) => { items = items.filter((item) => item.id !== id); return ok(true); },
      insertLocation: (record) => { locations = [...locations, { ...record, user_id: "owner" }]; return ok(locations.at(-1)); },
      updateLocation: (id, patch) => { locations = locations.map((item) => item.id === id ? { ...item, ...patch } : item); return ok(locations.find((item) => item.id === id)); },
      removeLocation: (id) => { locations = locations.filter((item) => item.id !== id); return ok(true); },
      insertWearLog: (record) => ok(record),
    };

    const controller = createWardrobeController({
      root: document.querySelector("#wardrobeRoot"),
      repository,
      getSession: () => ({ user: { id: "owner" } }),
      getFamilyMembers: () => [
        { user_id: "owner", username: "咻蛋", avatar_url: "../assets/black-cat-logo.png" },
        { user_id: "member", username: "蛋", avatar_url: "../assets/home-logo.jpg" },
      ],
      uploadFile: async () => ({ url: images.square.url, thumbnailUrl: images.square.thumbnailUrl, path: "fixture", thumbnailPath: "fixture-thumb" }),
      importUrl: async (url) => ({ url, thumbnailUrl: url, path: "fixture-url" }),
      deleteAsset: async () => true,
      confirmAction: async () => true,
      notify: () => {},
      onExperience: async () => {},
    });
    await controller.load();
