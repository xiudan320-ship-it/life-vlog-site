<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>

  <title>周末卡片视觉验收</title>

  <style>
    body { min-height: 100vh; margin: 0; padding: 72px 7vw; background: var(--bg); }

<body class="theme-dark">
  <section class="weekend-list">

      <div class="weekend-card-body">

        <h3>国立科学博物馆</h3>

      </div>
    </article>
    <article class="weekend-card done">
      <span class="weekend-complete-mark">完成</span>
      <div class="weekend-date"><span>7月</span><strong>19日</strong><small>周日</small></div>
      <div class="weekend-card-body">

        <p class="weekend-location">地点：所泽站</p>
        <p>想点的东西很多，先把这段计划写得长一点，检查内容换行后日期和操作按钮仍然稳定。</p>
        <div class="weekend-card-actions"><button>编辑</button><button>完成</button><button>删除</button></div>
