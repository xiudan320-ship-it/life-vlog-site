<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d100f">
  <title>黑暗传说 · 咻蛋之家</title>
</head>
<body>
  <header class="monster-host-header">
    <a href="/">返回咻蛋之家</a>
    <span aria-label="账号云存档">云档 <b id="monsterCloudIndicator">✓</b></span>
  </header>
  <main>
    <div id="monsterFrame"><canvas id="monsterCanvas" width="640" height="960" aria-label="黑暗传说原版资源游戏画面"></canvas></div>
    <nav class="monster-controls" aria-label="游戏操作">
      <button id="monsterEnter" type="button" disabled>进入游戏</button>
      <button id="monsterAdventure" type="button" disabled>选择关卡</button>
      <button id="monsterRole" type="button" disabled>角色</button>
      <button id="monsterSkills" type="button" disabled>技能</button>
      <button id="monsterBag" type="button" disabled>背包</button>
    </nav>
    <p id="monsterStatus" role="status">正在加载原版资源…</p>
    <button id="monsterStop" type="button" hidden>本场结束后停止</button>
    <p class="monster-save-line"><span id="monsterSaveStatus"></span><button id="monsterSaveRetry" type="button" hidden>重试保存</button></p>
  </main>
  <dialog id="monsterNewGame" aria-labelledby="monsterNewGameTitle">
    <form id="monsterNewGameForm">
      <h1 id="monsterNewGameTitle">新建角色</h1>
      <label for="monsterName">角色名字</label>
      <input id="monsterName" name="name" required autocomplete="off">
      <img class="monster-new-hero" src="/monster/assets/ani/2001.png" alt="勇者">
      <div class="monster-dialog-actions"><button type="button" id="monsterNewCancel">返回</button><button type="submit">开始冒险</button></div>
    </form>
  </dialog>
  <dialog id="monsterDetails" aria-labelledby="monsterDetailsTitle">
    <div class="monster-dialog-heading"><h2 id="monsterDetailsTitle"></h2><button type="button" id="monsterDetailsClose" aria-label="关闭">返回</button></div>
    <div id="monsterDetailsContent"></div>
  </dialog>
  <dialog id="monsterItemDetails" aria-label="物品详情">
    <button type="button" id="monsterItemClose" class="monster-item-close">关闭</button>
    <div class="monster-item-information"></div>
  </dialog>
  <script type="module" src="/modules/monster/entry.js"></script>
</body>
</html>
